services:
  - type: web
    name: quote-desk-api
    runtime: python
    rootDir: backend
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
